name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# contents: write 用于提交版本号并推送标签；id-token: write 用于 Trusted Publishing。
permissions:
  contents: write
  id-token: write

# 串行执行，避免两次推送同时升版本、同时发布。
concurrency:
  group: ci-cd-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 测试
        shell: pwsh
        run: |
          npm test *> test-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 把失败尾部写进 check run 注解，便于公开排查。
            $tail = (Get-Content test-output.log -Tail 60) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error title=测试失败（尾部输出）::$escaped"
            Get-Content test-output.log -Tail 120
            exit $code
          }

      - name: 构建
        run: npm run build

      # 提交信息包含 [skip release] 时只验证、不发布（用于纯文档或实验提交）。
      - name: 提升补丁版本
        if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
        shell: pwsh
        run: npm version patch --no-git-tag-version

      # 先发布再提交标签：发布失败时不会留下指向未发布版本的孤儿标签。
      - name: 发布到 VS Code Marketplace
        if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
        run: npx --yes @vscode/vsce publish --oidc

      - name: 提交版本并推送标签
        if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$version [skip release]"
          git tag "v$version"
          git push origin HEAD:main "v$version"
